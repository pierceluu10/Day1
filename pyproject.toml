[project]
name = "dayone"
version = "0.1.0"
description = "Day One: an onboarding agent with verified task state and experience memory on MongoDB Atlas"
requires-python = ">=3.11"
dependencies = [
  "anthropic",
  "fastapi",
  "httpx",
  "playwright",
  "pymongo",
  "python-dotenv",
  "uvicorn",
]

[project.scripts]
dayone = "dayone.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dayone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
